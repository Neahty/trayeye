      <stop offset="0" stop-color="#b9f6ca" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b9f6ca" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b9f6ca" stop-opacity="0"/>
