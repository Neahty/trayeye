name: ✨ Предложить идею
description: Новая функция или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решаем
      description: Для кого это и какая боль у пользователя
    validations: {required: true}
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations: {required: true}
