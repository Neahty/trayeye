name: 🐞 Сообщить об ошибке
description: Что-то работает не так, как ожидалось
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Что вы ожидали и что получили
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: "1. Открыть ...\n2. Нажать ...\n3. Увидеть ..."
    validations: {required: true}
  - type: input
    id: env
    attributes:
      label: Окружение
      placeholder: "Браузер / устройство / версия"
