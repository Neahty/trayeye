name: Auto-merge claude branches & deploy

on:
  push:
    branches: ["claude/**"]

concurrency:
  # ВАЖНО: группа ДОЛЖНА отличаться от deploy-production в deploy.yml. У переиспользуемого
  # workflow_call не может быть той же concurrency-группы, что у вызывающего workflow -
  # иначе вложенный деплой падает (job вообще не создаётся). Реальную сериализацию выката
  # обеспечивает сам deploy.yml (группа deploy-production).
  group: auto-merge-claude
  cancel-in-progress: false

jobs:
  # Тесты ДО мёржа в master: раньше npm run test:ci не вызывал ни один воркфлоу, и любая
  # регрессия в подсчёте лимитов, КБЖУ или стоимости уезжала в прод без единой проверки.
  # Красные тесты теперь просто не пускают ветку в master - деплоя не будет.
  test:
    if: contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # Та же мажорная версия, что на проде (v20) - иначе тесты зелёные там, где прод падает.
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Тесты сервера
        working-directory: server
        run: |
          npm ci
          npm run test:ci

  merge:
    # деплоим только по явной команде пользователя ([deploy] в сообщении коммита)
    if: contains(github.event.head_commit.message, '[deploy]')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge pushed claude branch into master
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --ff-only "origin/${GITHUB_REF_NAME}" \
            || git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin master
      - name: Delete merged branch
        continue-on-error: true
        run: git push origin --delete "${GITHUB_REF_NAME}"

  deploy:
    needs: merge
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
