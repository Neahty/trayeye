<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bytwise</title>
    <style>
      /* Эта страница лежит внутри приложения и показывается, когда сервер
         недоступен: интерфейс грузится с сайта, и без сети его взять неоткуда. */
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #F3F3F6; color: #181820;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center; padding: 32px;
      }
      .box { max-width: 320px; }
      h1 { font-size: 21px; margin: 0 0 10px; font-weight: 800; }
      p { color: #8B8B98; line-height: 1.5; margin: 0 0 24px; font-size: 15px; }
      button {
        font: inherit; font-weight: 700; color: #fff; border: none; cursor: pointer;
        background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
        border-radius: 14px; padding: 14px 28px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #131318; color: #F2F2F5; }
        p { color: #9A9AA6; }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Нет связи с сервером</h1>
      <p>Bytwise не смог загрузиться. Проверьте интернет и попробуйте ещё раз.</p>
      <button onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
