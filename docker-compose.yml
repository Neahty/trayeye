services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Berlin
  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      - TRAYEYE_API_URL=http://api:8000
    depends_on:
      - api
